services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seo_autopilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - seo_autopilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seo_autopilot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  seo_autopilot_postgres:
